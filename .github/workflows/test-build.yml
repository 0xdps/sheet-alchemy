name: Test & Build

on:
  push:
    branches: [ trunk, develop ]
  pull_request:
    branches: [ trunk ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Continue running other matrix jobs even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=61.0" wheel
        pip install -e .
        pip install -e ".[dev]"
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 sheetalchemy --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. Allow some minor style issues
        flake8 sheetalchemy --count --exit-zero --max-complexity=10 --max-line-length=135 --extend-ignore=E203,F401 --statistics
        
    - name: Check formatting with black
      run: |
        black --check sheetalchemy/
        
    - name: Check import sorting with isort
      run: |
        isort --check-only sheetalchemy/
        
    - name: Type checking with mypy
      run: |
        mypy sheetalchemy/ --ignore-missing-imports --no-strict-optional --allow-untyped-calls --allow-incomplete-defs || true
        
    - name: Test with pytest
      run: |
        pytest tests/ --cov=sheetalchemy --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: |
        python -m build
        
    - name: Check package
      run: |
        twine check dist/*

  # Summary job that depends on all test jobs and fails if any test job failed
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()  # Always run, even if test jobs fail
    
    steps:
    - name: Check test results
      run: |
        echo "Test job results:"
        echo "Needs context: ${{ toJson(needs) }}"
        
        # Check if any test job failed
        if [[ "${{ needs.test.result }}" == "failure" ]]; then
          echo "❌ Some test jobs failed"
          echo "::error::One or more test matrix jobs failed. Check the individual job logs for details."
          exit 1
        elif [[ "${{ needs.test.result }}" == "cancelled" ]]; then
          echo "⏹️ Test jobs were cancelled"
          echo "::error::Test jobs were cancelled."
          exit 1
        else
          echo "✅ All test jobs passed successfully"
        fi
        
    - name: Create test summary
      run: |
        echo "## 🧪 Test Matrix Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.test.result }}" == "success" ]]; then
          echo "✅ **Status**: All tests passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Python versions (3.8-3.13) and operating systems (Ubuntu, Windows, macOS) tested successfully." >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Status**: Some tests failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check individual job logs for failure details:" >> $GITHUB_STEP_SUMMARY
          echo "- [Test Jobs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        fi