name: CI

on:
  push:
    branches: [ trunk, develop ]
  pull_request:
    branches: [ trunk ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -e ".[dev]"
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 sheetalchemy --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. Allow some minor style issues
        flake8 sheetalchemy --count --exit-zero --max-complexity=10 --max-line-length=135 --extend-ignore=E203,F401 --statistics
        
    - name: Check formatting with black
      run: |
        black --check sheetalchemy/
        
    - name: Check import sorting with isort
      run: |
        isort --check-only sheetalchemy/
        
    - name: Type checking with mypy
      run: |
        mypy sheetalchemy/ --ignore-missing-imports --no-strict-optional --allow-untyped-calls --allow-incomplete-defs || true
        
    - name: Test with pytest
      run: |
        pytest tests/ --cov=sheetalchemy --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: |
        python -m build
        
    - name: Check package
      run: |
        twine check dist/*