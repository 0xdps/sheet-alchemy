name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: 
      name: pypi
      url: https://pypi.org/p/sheetalchemy
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=61.0" wheel
        pip install build twine

    - name: Verify version matches tag
      run: |
        PACKAGE_VERSION=$(python -c "import sheetalchemy; print(sheetalchemy.__version__)")
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "Package version: $PACKAGE_VERSION"
        echo "Tag version: $TAG_VERSION"
        if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ Version mismatch! Package version ($PACKAGE_VERSION) doesn't match tag ($TAG_VERSION)"
          exit 1
        fi
        echo "✅ Version check passed"

    - name: Run tests
      run: |
        # Install the package with dev dependencies
        pip install -e ".[dev]"
        
        # Run the test suite
        pytest tests/ --cov=sheetalchemy --cov-report=term
        
        # Run linting
        flake8 sheetalchemy --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 sheetalchemy --count --exit-zero --max-complexity=10 --max-line-length=135 --extend-ignore=E203,F401 --statistics
        
        # Check code formatting
        black --check sheetalchemy/
        
        # Check import sorting
        isort --check-only sheetalchemy/

    - name: Build package
      run: |
        # Clean previous builds
        rm -rf build/ dist/ *.egg-info/
        
        # Build source distribution and wheel
        python -m build
        
        # List built files
        echo "Built files:"
        ls -la dist/

    - name: Validate package
      run: |
        # Check package integrity
        python -m twine check dist/*
        
        # Test package installation
        pip install dist/*.whl
        python -c "import sheetalchemy; print(f'Successfully installed sheetalchemy v{sheetalchemy.__version__}')"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
        verbose: true

    - name: Create deployment summary
      run: |
        PACKAGE_VERSION=$(python -c "import sheetalchemy; print(sheetalchemy.__version__)")
        echo "## 🚀 PyPI Deployment Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** sheetalchemy" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** $PACKAGE_VERSION" >> $GITHUB_STEP_SUMMARY
        echo "**PyPI URL:** https://pypi.org/project/sheetalchemy/$PACKAGE_VERSION/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Installation" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "pip install sheetalchemy==$PACKAGE_VERSION" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Release Notes" >> $GITHUB_STEP_SUMMARY
        echo "See the [release page](https://github.com/${{ github.repository }}/releases/tag/v$PACKAGE_VERSION) for details." >> $GITHUB_STEP_SUMMARY