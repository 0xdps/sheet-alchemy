name: Test PyPI Publishing

on:
  pull_request:
    paths:
      - 'sheetalchemy/__init__.py'
      - 'pyproject.toml'
      - '.github/workflows/publish.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-build:
    name: Test Package Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade "setuptools>=61.0" wheel
        pip install build twine

    - name: Run tests
      run: |
        # Install the package with dev dependencies
        pip install -e ".[dev]"
        
        # Run quick test suite
        pytest tests/ --cov=sheetalchemy --cov-report=term
        
        # Run linting checks
        flake8 sheetalchemy --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Test package build
      run: |
        # Clean previous builds
        rm -rf build/ dist/ *.egg-info/
        
        # Build source distribution and wheel
        python -m build
        
        # List built files
        echo "Built files:"
        ls -la dist/

    - name: Validate package
      run: |
        # Check package integrity
        python -m twine check dist/*
        
        # Test package installation
        pip install dist/*.whl
        python -c "import sheetalchemy; print(f'Package test successful: sheetalchemy v{sheetalchemy.__version__}')"

    - name: Test package metadata
      run: |
        # Extract and display package metadata
        python -c "
        import pkg_resources
        import json
        
        dist = pkg_resources.get_distribution('sheetalchemy')
        print(f'Name: {dist.project_name}')
        print(f'Version: {dist.version}')
        print(f'Location: {dist.location}')
        print(f'Dependencies: {list(dist.requires())}')
        "

    - name: Create build summary
      run: |
        PACKAGE_VERSION=$(python -c "import sheetalchemy; print(sheetalchemy.__version__)")
        echo "## 📦 Package Build Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
        echo "📦 **Package:** sheetalchemy" >> $GITHUB_STEP_SUMMARY  
        echo "🏷️ **Version:** $PACKAGE_VERSION" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Build Artifacts" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ls -la dist/ >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY